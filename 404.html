<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex">
  <title>Page Not Found — Parhao AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 15%,#1c3150 0,transparent 45%),#0b1220;color:#f5f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{width:min(560px,100%)}.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;margin-bottom:55px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#6ee7c2,#83aaff);display:grid;place-items:center;color:#0b1725;font-weight:900}
    .code{font-size:clamp(6rem,22vw,10rem);line-height:1;font-weight:900;letter-spacing:-9px;color:#6ee7c2;margin:0;text-shadow:0 15px 70px rgba(110,231,194,.14)}
    h1{font-size:2rem;letter-spacing:-1px;margin:18px 0 10px}p{color:#a9b5c8;line-height:1.7;margin:0 auto 28px;max-width:430px}
    a{display:inline-flex;padding:12px 21px;border-radius:999px;background:#6ee7c2;color:#092019;text-decoration:none;font-weight:800;transition:.2s}a:hover{transform:translateY(-2px);filter:brightness(1.05)}
    .hint{margin-top:48px;font-size:.82rem;color:#718198}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><span class="logo">P</span><span style="color:#f5f7fb">Parhao AI</span></a>
    <p class="code">404</p>
    <h1>Oops! Page not found.</h1>
    <p>The page you are looking for may have moved, been removed, or the link may be incorrect. Let's get you back to learning.</p>
    <a href="/">Back to homepage <span aria-hidden="true">&nbsp;→</span></a>
    <div class="hint">Parhao AI · Learn smarter, one question at a time.</div>
  </main>
</body>
</html>
